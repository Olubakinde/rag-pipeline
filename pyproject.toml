[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "A modular document ingestion and retrieval pipeline"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6",
    "python-docx>=1.2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "reportlab"
]

embeddings = [
    "sentence-transformers>=3.0"
]

[tool.setuptools.packages.find]
where = ["src"]